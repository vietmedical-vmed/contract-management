<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Hợp đồng</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      slate:   {50:'#f0f2f5',100:'#e4e6eb',200:'#dadde1',300:'#ccd0d5',400:'#8a8d91',500:'#65676b',600:'#4b4f56',700:'#3a3b3c',800:'#242526',900:'#18191a'},
      blue:    {50:'#e7f3ff',100:'#cfe4ff',200:'#a8c8ff',300:'#7aa7fb',400:'#4a90f2',500:'#1877f2',600:'#166fe5',700:'#0c5dc7',800:'#0a4fa8',900:'#0a3a7a'},
      emerald: {50:'#e7f3ff',100:'#cfe4ff',200:'#a8c8ff',300:'#7aa7fb',400:'#4a90f2',500:'#1877f2',600:'#166fe5',700:'#0c5dc7',800:'#0a4fa8',900:'#0a3a7a'},
      sky:     {50:'#e7f3ff',100:'#cfe4ff',200:'#a8c8ff',300:'#7aa7fb',400:'#4a90f2',500:'#1877f2',600:'#166fe5',700:'#0c5dc7',800:'#0a4fa8',900:'#0a3a7a'},
      red:     {50:'#fdecee',100:'#fad3d6',200:'#f5aab0',300:'#ef7d85',400:'#f9525c',500:'#fa383e',600:'#e41e3f',700:'#c81f3d',800:'#9f1830',900:'#7a1225'},
      accent:  {DEFAULT:'#1877f2'},
    }}}}
  </script>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      background: #f0f2f5;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .boot-spinner {
      width: 36px; height: 36px;
      border: 3px solid #dadde1; border-top-color: #1877f2;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #boot-err { display: none; margin-top: 16px; color: #dc2626; text-align: center; font-size: 14px; max-width: 320px; }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-spinner"></div>
    <div id="boot-err"></div>
  </div>
  <div id="root"></div>

  <!-- React 18 production -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script>
    setTimeout(function () {
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        var e = document.getElementById('boot-err');
        e.textContent = 'Không tải được React. Kiểm tra kết nối mạng và thử lại.';
        e.style.display = 'block';
      }
    }, 5000);
  </script>

  <!-- ExcelJS for Excel export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

  <!-- App modules (thu tu quan trong: config -> api -> auth -> router -> screens -> app) -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/filters.js"></script>
  <script src="assets/js/screens/dashboard.js"></script>
  <script src="assets/js/screens/contracts.js"></script>
  <script src="assets/js/screens/contract-detail.js"></script>
  <script src="assets/js/screens/alerts.js"></script>
  <script src="assets/js/screens/config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
